<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Sprite Test</title>
<style>
body{
background:#000;
color:#fff;
font-family:monospace;
text-align:center;
padding:20px;
}

#agent{
width:64px;
height:128px;
margin:20px auto;
background:url('Agent.png') no-repeat;
background-size:384px 128px;
image-rendering:pixelated;
background-position:0 0;
}

button{
display:block;
width:180px;
margin:8px auto;
padding:10px;
font-size:15px;
background:#111;
color:#fff;
border:2px solid red;
}
</style>
</head>
<body>

<h1>AGENT TEST</h1>

<div id="agent"></div>

<button onclick="pose1()">POSE 1</button>
<button onclick="pose2()">POSE 2</button>
<button onclick="pose3()">POSE 3</button>
<button onclick="pose4()">POSE 4</button>
<button onclick="pose5()">POSE 5</button>
<button onclick="pose6()">POSE 6</button>

<script>
const agent=document.getElementById('agent');

function pose1(){
agent.style.backgroundPosition='0 0';
}

function pose2(){
agent.style.backgroundPosition='-64px 0';
}

function pose3(){
agent.style.backgroundPosition='-128px 0';
}

function pose4(){
agent.style.backgroundPosition='-192px 0';
}

function pose5(){
agent.style.backgroundPosition='-256px 0';
}

function pose6(){
agent.style.backgroundPosition='-320px 0';
}
</script>

</body>
</html>
