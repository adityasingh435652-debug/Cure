<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Cure</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
background:#0b0f14;
color:#e8f1ff;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
user-select:none;
-webkit-user-select:none;
}

h1{
font-size:26px;
color:#00ff9d;
margin-bottom:10px;
letter-spacing:2px;
}

p{
color:#9fb3c8;
margin-bottom:20px;
}

#agent{
width:275px;
height:384px;
margin:0 auto 20px;
background:url('Agent.png') no-repeat;
background-size:1375px 768px;
background-position:0 0;
image-rendering:pixelated;
}

button{
display:block;
width:100%;
max-width:320px;
margin:10px auto;
padding:15px;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
color:#04121a;
background:#00ff9d;
user-select:none;
-webkit-user-select:none;
touch-action:none;
-webkit-touch-callout:none;
}

button:active{
background:#00c97d;
}

#rifleButton{
background:#ffd400;
color:#241c00;
}

#injuredButton{
background:#ff5252;
color:#ffffff;
}
</style>
</head>
<body>

<h1>OPERATION CURE</h1>
<p>Hold a weapon button to keep firing.</p>

<div id="agent"></div>

<button id="handgunButton">HOLD TO SHOOT HANDGUN</button>

<button id="rifleButton">HOLD TO SHOOT RIFLE</button>

<button id="injuredButton">INJURED</button>

<script>
const agent=document.getElementById('agent');
const handgunButton=document.getElementById('handgunButton');
const rifleButton=document.getElementById('rifleButton');
const injuredButton=document.getElementById('injuredButton');

const handgunSound=new Audio('handgun-shot.mp3');
const rifleSound=new Audio('rifle-shot.mp3');

handgunSound.preload='auto';
rifleSound.preload='auto';

handgunSound.load();
rifleSound.load();

let weaponTimer=null;
let frame=0;

function setPose(column,row){
agent.style.backgroundPosition=(column-1)*-275+'px '+(row-1)*-384+'px';
}

function idle(){
setPose(1,1);
}

function injured(){
setPose(5,2);
}

function handgunReady(){
setPose(2,1);
}

function handgunAim(){
setPose(3,1);
}

function handgunFire(){
setPose(4,1);

handgunSound.currentTime=0;
handgunSound.play().catch(function(){
});
}

function rifleReady(){
setPose(1,2);
}

function rifleAim(){
setPose(2,2);
}

function rifleFire(){
setPose(3,2);

rifleSound.currentTime=0;
rifleSound.play().catch(function(){
});
}

function startHandgun(){
if(weaponTimer!==null){
return;
}

frame=0;

handgunReady();

weaponTimer=setInterval(function(){
frame=frame+1;

if(frame===1){
handgunAim();
}else if(frame===2){
handgunFire();
}else{
frame=0;
handgunAim();
}

},100);
}

function startRifle(){
if(weaponTimer!==null){
return;
}

frame=0;

rifleReady();

weaponTimer=setInterval(function(){
frame=frame+1;

if(frame===1){
rifleAim();
}else if(frame===2){
rifleFire();
}else{
frame=0;
rifleAim();
}

},100);
}

function stopShooting(){
clearInterval(weaponTimer);
weaponTimer=null;

idle();
}

handgunButton.addEventListener('pointerdown',startHandgun);
handgunButton.addEventListener('pointerup',stopShooting);
handgunButton.addEventListener('pointercancel',stopShooting);
handgunButton.addEventListener('pointerleave',stopShooting);

rifleButton.addEventListener('pointerdown',startRifle);
rifleButton.addEventListener('pointerup',stopShooting);
rifleButton.addEventListener('pointercancel',stopShooting);
rifleButton.addEventListener('pointerleave',stopShooting);

injuredButton.addEventListener('click',injured);

handgunButton.addEventListener('contextmenu',function(event){
event.preventDefault();
});

rifleButton.addEventListener('contextmenu',function(event){
event.preventDefault();
});

injuredButton.addEventListener('contextmenu',function(event){
event.preventDefault();
});
</script>

</body>
</html>
