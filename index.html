<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Cure</title>
<style>
body{
background:black;
color:white;
font-family:monospace;
text-align:center;
padding-top:100px;
}

button{
padding:15px 25px;
font-size:18px;
background:#111;
color:white;
border:2px solid red;
}
#agent{
width:128px;
height:128px;
margin:20px auto;
background:url('Agent.png') no-repeat;
background-size:384px 128px;
image-rendering:pixelated;
}

.agent-idle{
background-position:0 0;
}

.agent-shoot{
background-position:-128px 0;
}

.agent-hurt{
background-position:-256px 0;
}</style>
</head>
<body>

<h1>OPERATION CURE</h1>
<p>The outbreak has begun.</p>

<button onclick="startMission()">START</button>
<button onclick="agentIdle()">IDLE</button>
<button onclick="agentShoot()">SHOOT</button>
<button onclick="agentHurt()">HURT</button>
<div id="agent" class="agent agent-idle"></div>
<p id="message"></p>

<script>
function startMission(){
document.getElementById('message').textContent='Mission started. Agent Raze has landed on the island.';
}
const agent=document.getElementById('agent');

function setAgent(pose){
agent.className='agent '+pose;
}

function agentIdle(){
setAgent('agent-idle');
document.getElementById('message').textContent='Agent Raze is ready.';
}

function agentShoot(){
setAgent('agent-shoot');
document.getElementById('message').textContent='Agent Raze fires!';
}

function agentHurt(){
setAgent('agent-hurt');
document.getElementById('message').textContent='Agent Raze is injured!';
}
</script>

</body>
</html>
