<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Cure</title>
<style>
body{
background:black;
color:white;
font-family:monospace;
text-align:center;
padding-top:100px;
}

button{
padding:15px 25px;
font-size:18px;
background:#111;
color:white;
border:2px solid red;
}
#agent{
width:96px;
height:128px;
margin:30px auto;
background:url('Agent.png') no-repeat;
background-size:384px 128px;
image-rendering:pixelated;
background-position:0 0;
}

.pose1{
background-position:0 0;
}

.pose2{
background-position:-96px 0;
}

.pose3{
background-position:-192px 0;
}

.pose4{
background-position:-288px 0;
}
}</style>
</head>
<body>

<h1>OPERATION CURE</h1>
<p>The outbreak has begun.</p>

<button onclick="pose1()">POSE 1</button>
<button onclick="pose2()">POSE 2</button>
<button onclick="pose3()">POSE 3</button>
<button onclick="pose4()">POSE 4</button>
<div id="agent" class="pose1"></div> 
<p id="message"></p>

<script>
function startMission(){
document.getElementById('message').textContent='Mission started. Agent Raze has landed on the island.';
}
const agent=document.getElementById('agent');

function setPose(number){
agent.className='pose'+number;
}

function pose1(){
setPose(1);
}

function pose2(){
setPose(2);
}

function pose3(){
setPose(3);
}

function pose4(){
setPose(4);
}
</script>

</body>
</html>
