<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Cure</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
background:#0b0f14;
color:#e8f1ff;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
user-select:none;
-webkit-user-select:none;
overflow:hidden;
}

h1{
font-size:24px;
color:#00ff9d;
margin-bottom:10px;
letter-spacing:2px;
}

#gameArea{
position:relative;
width:100%;
max-width:400px;
height:420px;
margin:0 auto;
background:#101820;
border:3px solid #00ff9d;
border-radius:12px;
overflow:hidden;
}

#agent{
position:absolute;
left:20px;
bottom:20px;
width:275px;
height:384px;
background:url('Agent.png') no-repeat;
background-size:1375px 768px;
background-position:0 0;
image-rendering:pixelated;
}

.bullet{
position:absolute;
width:18px;
height:6px;
border-radius:3px;
}

.handgunBullet{
background:#ffd400;
box-shadow:0 0 8px #ffd400;
}

.rifleBullet{
background:#00d9ff;
box-shadow:0 0 8px #00d9ff;
}

#weaponButtons{
margin-top:15px;
}

button{
display:block;
width:100%;
max-width:320px;
margin:10px auto;
padding:15px;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
color:#04121a;
background:#00ff9d;
user-select:none;
-webkit-user-select:none;
touch-action:none;
-webkit-touch-callout:none;
}

button:active{
background:#00c97d;
}

#rifleButton{
background:#ffd400;
color:#241c00;
}

#switchButton{
background:#00a2ff;
color:#00121a;
}
</style>
</head>
<body>

<h1>OPERATION CURE</h1>

<div id="gameArea">
<div id="agent"></div>
</div>

<div id="weaponButtons">
<button id="switchButton">WEAPON: HANDGUN</button>
<button id="handgunButton">HOLD TO SHOOT</button>
</div>

<script>
const agent=document.getElementById('agent');
const gameArea=document.getElementById('gameArea');
const handgunButton=document.getElementById('handgunButton');
const switchButton=document.getElementById('switchButton');

const handgunSound=new Audio('handgun-shot.mp3');
handgunSound.preload='auto';
handgunSound.load();

let currentWeapon='handgun';
let weaponTimer=null;
let frame=0;

function setPose(column,row){
agent.style.backgroundPosition=(column-1)*-275+'px '+(row-1)*-384+'px';
}

function idle(){
setPose(1,1);
}

function handgunReady(){
setPose(2,1);
}

function handgunAim(){
setPose(3,1);
}

function handgunFire(){
setPose(4,1);

handgunSound.currentTime=0;
handgunSound.play().catch(function(){
});

createBullet('handgun');
}

function rifleReady(){
setPose(1,2);
}

function rifleAim(){
setPose(2,2);
}

function rifleFire(){
setPose(3,2);

createBullet('rifle');
}

function createBullet(weapon){
const bullet=document.createElement('div');

if(weapon==='handgun'){
bullet.className='bullet handgunBullet';
}else{
bullet.className='bullet rifleBullet';
}

bullet.style.left='300px';
bullet.style.bottom='300px';

gameArea.appendChild(bullet);

let bulletPosition=300;

const bulletTimer=setInterval(function(){
bulletPosition=bulletPosition+12;
bullet.style.left=bulletPosition+'px';

if(bulletPosition>420){
clearInterval(bulletTimer);
bullet.remove();
}
},20);
}

function switchWeapon(){
if(currentWeapon==='handgun'){
currentWeapon='rifle';
switchButton.textContent='WEAPON: RIFLE';
}else{
currentWeapon='handgun';
switchButton.textContent='WEAPON: HANDGUN';
}

stopShooting();
idle();
}

function startShooting(){
if(weaponTimer!==null){
return;
}

frame=0;

if(currentWeapon==='handgun'){
handgunReady();

weaponTimer=setInterval(function(){
frame=frame+1;

if(frame===1){
handgunAim();
}else if(frame===2){
handgunFire();
}else{
frame=0;
handgunAim();
}

},100);
}else{
rifleReady();

weaponTimer=setInterval(function(){
frame=frame+1;

if(frame===1){
rifleAim();
}else if(frame===2){
rifleFire();
}else{
frame=0;
rifleAim();
}

},70);
}
}

function stopShooting(){
clearInterval(weaponTimer);
weaponTimer=null;

handgunSound.pause();
handgunSound.currentTime=0;

idle();
}

handgunButton.addEventListener('pointerdown',startShooting);
handgunButton.addEventListener('pointerup',stopShooting);
handgunButton.addEventListener('pointercancel',stopShooting);
handgunButton.addEventListener('pointerleave',stopShooting);

switchButton.addEventListener('click',switchWeapon);

handgunButton.addEventListener('contextmenu',function(event){
event.preventDefault();
});

switchButton.addEventListener('contextmenu',function(event){
event.preventDefault();
});
</script>

</body>
</html>
