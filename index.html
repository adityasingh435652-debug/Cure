<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Cure - Sprite Test</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
background:#0b0f14;
color:#e8f1ff;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

h1{
font-size:24px;
color:#00ff9d;
margin-bottom:10px;
}

p{
color:#9fb3c8;
margin-bottom:20px;
}

#agent{
width:275px;
height:384px;
margin:0 auto 20px;
background:url('Agent.png') no-repeat;
background-size:1375px 768px;
background-position:0 0;
image-rendering:pixelated;
}

button{
display:inline-block;
width:80px;
margin:5px;
padding:12px 0;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
color:#04121a;
background:#00ff9d;
}

button:active{
background:#00c97d;
}
</style>
</head>
<body>

<h1>SPRITE TEST</h1>
<p>Tap each button. Tell me what appears in every pose.</p>

<div id="agent"></div>

<button onclick="pose1()">1</button>
<button onclick="pose2()">2</button>
<button onclick="pose3()">3</button>
<button onclick="pose4()">4</button>
<button onclick="pose5()">5</button>

<br>

<button onclick="pose6()">6</button>
<button onclick="pose7()">7</button>
<button onclick="pose8()">8</button>
<button onclick="pose9()">9</button>
<button onclick="pose10()">10</button>

<script>
const agent=document.getElementById('agent');

function setPose(column,row){
agent.style.backgroundPosition=(column-1)*-275+'px '+(row-1)*-384+'px';
}

function pose1(){setPose(1,1);}
function pose2(){setPose(2,1);}
function pose3(){setPose(3,1);}
function pose4(){setPose(4,1);}
function pose5(){setPose(5,1);}

function pose6(){setPose(1,2);}
function pose7(){setPose(2,2);}
function pose8(){setPose(3,2);}
function pose9(){setPose(4,2);}
function pose10(){setPose(5,2);}
</script>

</body>
</html>
